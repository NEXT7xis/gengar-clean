name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Criar projeto e compilar
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Gengar-Clean"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n' > gradle.properties

          mkdir -p app/src/main/java/com/gengar/clean app/src/main/res/drawable-nodpi

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.gengar.clean"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.gengar.clean"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application
                  android:label="Gengar Clean"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF

          if [ -f gengar_wallpaper.webp ]; then
            cp gengar_wallpaper.webp app/src/main/res/drawable-nodpi/gengar_wallpaper.webp
          else
            cat > app/src/main/res/drawable-nodpi/gengar_wallpaper.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#8E24C4" />
          </shape>
          EOF
          fi

          cat > app/src/main/java/com/gengar/clean/MainActivity.kt <<'EOF'
          package com.gengar.clean

          import android.app.Activity
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.view.inputmethod.InputMethodManager
          import android.widget.*
          import rikka.shizuku.Shizuku

          class MainActivity : Activity() {
              private val pink = Color.parseColor("#E254D6")
              private val purple = Color.parseColor("#8E24C4")
              private val card = Color.parseColor("#120A18")
              private val mute = Color.parseColor("#9A86A6")
              private lateinit var list: LinearLayout
              private lateinit var status: TextView
              private val prefs by lazy { getSharedPreferences("gc", MODE_PRIVATE) }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun box(c: Int, r: Int = 14) = GradientDrawable().apply {
                  setColor(c); cornerRadius = dp(r).toFloat()
              }

              private fun toast(t: String) = Toast.makeText(this, t, Toast.LENGTH_LONG).show()

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.statusBarColor = Color.BLACK
                  window.navigationBarColor = Color.BLACK

                  val scroll = ScrollView(this).apply { setBackgroundColor(Color.BLACK) }
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  scroll.addView(root)

                  root.addView(ImageView(this).apply {
                      setImageResource(R.drawable.gengar_wallpaper)
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      layoutParams = LinearLayout.LayoutParams(-1, dp(220))
                  })

                  val body = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(24))
                  }
                  root.addView(body)

                  body.addView(TextView(this).apply {
                      text = "Gengar Clean"
                      textSize = 30f
                      setTextColor(pink)
                      typeface = Typeface.DEFAULT_BOLD
                  })
                  body.addView(TextView(this).apply {
                      text = "Só roda o que você escolher. O resto fica congelado."
                      setTextColor(mute)
                      setPadding(0, dp(4), 0, dp(16))
                  })

                  body.addView(button("Congelar apps em segundo plano", true) { apply(true) })
                  body.addView(button("Descongelar tudo", false) { apply(false) })

                  status = TextView(this).apply {
                      setTextColor(pink)
                      setPadding(dp(4), dp(8), 0, dp(12))
                  }
                  body.addView(status)

                  body.addView(TextView(this).apply {
                      text = "Ligue a chave dos apps que devem continuar rodando."
                      setTextColor(Color.WHITE)
                      setPadding(dp(4), 0, 0, dp(8))
                  })

                  list = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  body.addView(list)

                  setContentView(scroll)
                  render()
              }

              private fun button(t: String, main: Boolean, click: () -> Unit) = Button(this).apply {
                  text = t
                  isAllCaps = false
                  textSize = 16f
                  setTextColor(Color.WHITE)
                  background = if (main) GradientDrawable(
                      GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(purple, pink)
                  ).apply { cornerRadius = dp(16).toFloat() } else box(card, 16)
                  layoutParams = LinearLayout.LayoutParams(-1, dp(54)).apply { bottomMargin = dp(8) }
                  setOnClickListener { click() }
              }

              private fun userApps(): List<ApplicationInfo> {
                  val pm = packageManager
                  val skip = mutableSetOf(packageName, "moe.shizuku.privileged.api")
                  pm.resolveActivity(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME), 0)
                      ?.activityInfo?.packageName?.let { skip.add(it) }
                  (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager)
                      .enabledInputMethodList.forEach { skip.add(it.packageName) }
                  return pm.getInstalledApplications(0)
                      .filter { it.flags and ApplicationInfo.FLAG_SYSTEM == 0 && it.packageName !in skip }
                      .sortedBy { pm.getApplicationLabel(it).toString().lowercase() }
              }

              private fun render() {
                  list.removeAllViews()
                  val keep = prefs.getStringSet("keep", emptySet())!!.toMutableSet()
                  for (ai in userApps()) {
                      val frozen = !ai.enabled
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          background = box(card)
                          setPadding(dp(12), dp(10), dp(12), dp(10))
                          layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = dp(8) }
                      }
                      row.addView(ImageView(this).apply {
                          setImageDrawable(packageManager.getApplicationIcon(ai))
                          layoutParams = LinearLayout.LayoutParams(dp(40), dp(40))
                      })
                      val info = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(dp(12), 0, dp(8), 0)
                          layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                      }
                      info.addView(TextView(this).apply {
                          text = packageManager.getApplicationLabel(ai)
                          setTextColor(Color.WHITE)
                          textSize = 16f
                      })
                      info.addView(TextView(this).apply {
                          text = if (frozen) "Congelado" else "Pode rodar"
                          setTextColor(if (frozen) Color.parseColor("#6F9BD6") else mute)
                          textSize = 13f
                      })
                      row.addView(info)
                      row.addView(Switch(this).apply {
                          isChecked = ai.packageName in keep
                          setOnCheckedChangeListener { _, on ->
                              if (on) keep.add(ai.packageName) else keep.remove(ai.packageName)
                              prefs.edit().putStringSet("keep", keep).apply()
                          }
                      })
                      list.addView(row)
                  }
              }

              private fun ready(): Boolean {
                  if (!Shizuku.pingBinder()) {
                      toast("Abra o Shizuku e inicie o serviço primeiro.")
                      return false
                  }
                  if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                      Shizuku.requestPermission(1)
                      toast("Autorize o Gengar Clean no Shizuku e toque de novo.")
                      return false
                  }
                  return true
              }

              private fun sh(cmd: String): Boolean = try {
                  val m = Shizuku::class.java.getDeclaredMethod(
                      "newProcess", Array<String>::class.java, Array<String>::class.java, String::class.java
                  )
                  m.isAccessible = true
                  val p = m.invoke(null, arrayOf("sh", "-c", cmd), null, null) as Process
                  p.waitFor() == 0
              } catch (e: Throwable) {
                  false
              }

              private fun apply(freeze: Boolean) {
                  if (!ready()) return
                  val keep = prefs.getStringSet("keep", emptySet())!!
                  status.text = "Trabalhando..."
                  Thread {
                      var n = 0
                      for (ai in userApps()) {
                          val pkg = ai.packageName
                          if (freeze && pkg in keep) continue
                          val ok = if (freeze) sh("am force-stop $pkg; pm disable-user --user 0 $pkg")
                          else sh("pm enable $pkg")
                          if (ok) n++
                      }
                      runOnUiThread {
                          status.text = if (freeze) "$n apps congelados." else "$n apps descongelados."
                          render()
                      }
                  }.start()
              }
          }
          EOF

          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Gengar-Clean
          path: app/build/outputs/apk/debug/*.apk
