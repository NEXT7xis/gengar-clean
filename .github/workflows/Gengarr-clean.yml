              <path android:fillColor="#E254D6" android:pathData="M138,78 L104,94 L110,102 Q130,100 138,90 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M56,110 Q100,122 144,110 Q140,150 100,152 Q60,150 56,110 Z" />
